<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>MeshCore Infinity - Direct Flasher</title>
    <style>
        :root {
            --neon-green: #00ff66;
            --neon-glow: rgba(0, 255, 102, 0.3);
            --bg-dark: #050805;
            --card-bg: #0d140e;
            --text-main: #00ff66;
            --text-dim: #00aa44;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .terminal-container {
            background-color: var(--card-bg);
            border: 2px solid var(--neon-green);
            box-shadow: 0 0 25px var(--neon-glow);
            border-radius: 6px;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.4rem;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 2px;
            margin-top: 0;
            margin-bottom: 5px;
            text-shadow: 0 0 10px var(--neon-glow);
        }

        .subtitle {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select {
            width: 100%;
            background-color: var(--bg-dark);
            color: var(--neon-green);
            border: 2px solid var(--neon-green);
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            box-sizing: border-box;
        }

        select:focus {
            box-shadow: 0 0 10px var(--neon-glow);
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            background-color: var(--neon-green);
            color: var(--bg-dark);
            border: 2px solid var(--neon-green);
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 0 10px var(--neon-glow);
            font-size: 0.9rem;
        }

        button:hover {
            background-color: var(--bg-dark);
            color: var(--neon-green);
        }

        button:disabled {
            border-color: #333;
            background-color: #111;
            color: #555;
            box-shadow: none;
            cursor: not-allowed;
        }

        button#disconnectBtn {
            background-color: transparent;
            color: #ff4444;
            border-color: #ff4444;
            box-shadow: none;
        }

        button#disconnectBtn:hover:not(:disabled) {
            background-color: #ff4444;
            color: var(--bg-dark);
        }

        textarea {
            width: 100%;
            height: 200px;
            background-color: var(--bg-dark);
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            padding: 12px;
            border: 1px solid var(--text-dim);
            border-radius: 4px;
            box-sizing: border-box;
            resize: vertical;
            margin-top: 20px;
            font-size: 0.8rem;
            outline: none;
        }

        .footer-note {
            margin-top: 20px;
            font-size: 0.75rem;
            text-align: center;
            color: var(--text-dim);
            border-top: 1px dashed var(--text-dim);
            padding-top: 12px;
        }
    </style>
</head>
<body>

<div class="terminal-container">
    <h1>MeshCore Infinity</h1>
    <div class="subtitle">// Direct Flasher (Geen Erase / Behoud Settings)</div>

    <div class="form-group">
        <label for="boardSelect">&gt; Selecteer Hardware Model:</label>
        <select id="boardSelect"></select>
    </div>

    <div class="btn-row">
        <button id="connectBtn">1. Verbind USB</button>
        <button id="disconnectBtn" disabled>Ontkoppel</button>
    </div>

    <div class="btn-row">
        <button id="flashBtn" disabled style="background-color: #ffaa00; border-color: #ffaa00; color: #000;">2. Start Flashen</button>
    </div>

    <textarea id="log" readonly placeholder="[SYSTEM READY] Wacht op actie..."></textarea>

    <div class="footer-note">
        Geen geforceerde erases: je instellingen blijven netjes bewaard.
    </div>
</div>

<script type="module">
    import { ESPLoader, Transport } from "https://esm.sh/esptool-js";

    const firmwareConfigs = [
        {
            name: "Heltec V2",
            parts: [
                { path: "compiled_firmware/Heltec_v2_companion/bootloader.bin", offset: 0x1000 },
                { path: "compiled_firmware/Heltec_v2_companion/partitions.bin", offset: 0x8000 },
                { path: "compiled_firmware/Heltec_v2_companion/boot_app0.bin", offset: 0xe000 },
                { path: "compiled_firmware/Heltec_v2_companion/firmware.bin", offset: 0x10000 }
            ]
        },
        {
            name: "Heltec V3",
            parts: [
                { path: "compiled_firmware/Heltec_v3_companion/bootloader.bin", offset: 0x0 },
                { path: "compiled_firmware/Heltec_v3_companion/partitions.bin", offset: 0x8000 },
                { path: "compiled_firmware/Heltec_v3_companion/boot_app0.bin", offset: 0xe000 },
                { path: "compiled_firmware/Heltec_v3_companion/firmware.bin", offset: 0x10000 }
            ]
        },
        {
            name: "Heltec V4",
            parts: [
                { path: "compiled_firmware/Heltec_v4_companion/bootloader.bin", offset: 0x0 },
                { path: "compiled_firmware/Heltec_v4_companion/partitions.bin", offset: 0x8000 },
                { path: "compiled_firmware/Heltec_v4_companion/boot_app0.bin", offset: 0xe000 },
                { path: "compiled_firmware/Heltec_v4_companion/firmware.bin", offset: 0x10000 }
            ]
        },
        {
            name: "Heltec V4 TFT",
            parts: [
                { path: "compiled_firmware/Heltec_v4_tft_companion_radio/bootloader.bin", offset: 0x0 },
                { path: "compiled_firmware/Heltec_v4_tft_companion_radio/partitions.bin", offset: 0x8000 },
                { path: "compiled_firmware/Heltec_v4_tft_companion_radio/boot_app0.bin", offset: 0xe000 },
                { path: "compiled_firmware/Heltec_v4_tft_companion_radio/firmware.bin", offset: 0x10000 }
            ]
        },
        {
            name: "LilyGO T3S3",
            parts: [
                { path: "compiled_firmware/LilyGo_T3S3_sx1262_companion/bootloader.bin", offset: 0x0 },
                { path: "compiled_firmware/LilyGo_T3S3_sx1262_companion/partitions.bin", offset: 0x8000 },
                { path: "compiled_firmware/LilyGo_T3S3_sx1262_companion/boot_app0.bin", offset: 0xe000 },
                { path: "compiled_firmware/LilyGo_T3S3_sx1262_companion/firmware.bin", offset: 0x10000 }
            ]
        },
        {
            name: "Xiao S3 Wio",
            parts: [
                { path: "compiled_firmware/Xiao_S3_WIO_companion/bootloader.bin", offset: 0x0 },
                { path: "compiled_firmware/Xiao_S3_WIO_companion/partitions.bin", offset: 0x8000 },
                { path: "compiled_firmware/Xiao_S3_WIO_companion/boot_app0.bin", offset: 0xe000 },
                { path: "compiled_firmware/Xiao_S3_WIO_companion/firmware.bin", offset: 0x10000 }
            ]
        }
    ];

    const boardSelect = document.getElementById('boardSelect');
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const flashBtn = document.getElementById('flashBtn');
    const logArea = document.getElementById('log');

    let port;
    let transport;
    let esploader;

    // Vul de dropdown
    firmwareConfigs.forEach((config, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = config.name;
        boardSelect.appendChild(option);
    });

    function log(text) {
        logArea.value += text + '\n';
        logArea.scrollTop = logArea.scrollHeight;
    }

    const terminal = {
        clean() { logArea.value = ''; },
        writeLine(data) { log(data); },
        write(data) { logArea.value += data; logArea.scrollTop = logArea.scrollHeight; }
    };

    connectBtn.addEventListener('click', async () => {
        try {
            port = await navigator.serial.requestPort();
            transport = new Transport(port, true);
            
            esploader = new ESPLoader({
                transport: transport,
                baudrate: 921600,
                terminal: terminal
            });

            const chip = await esploader.main();
            log(`[VERBONDEN] Chip gedetecteerd: ${chip}`);
            
            connectBtn.disabled = true;
            disconnectBtn.disabled = false;
            flashBtn.disabled = false;
        } catch (e) {
            log(`[FOUT] Kan niet verbinden: ${e.message}`);
        }
    });

    disconnectBtn.addEventListener('click', async () => {
        if (transport) {
            await transport.disconnect();
        }
        connectBtn.disabled = false;
        disconnectBtn.disabled = true;
        flashBtn.disabled = true;
        log('[ONTKOPPELD]');
    });

    flashBtn.addEventListener('click', async () => {
        if (!esploader) return;

        flashBtn.disabled = true;
        terminal.clean();
        log('Start flash proces...');

        try {
            const selectedConfig = firmwareConfigs[boardSelect.value];
            const fileArray = [];

            // Haal automatisch alle bestanden op via fetch obv de gekozen hardware
            for (const part of selectedConfig.parts) {
                log(`Downloaden: ${part.path}...`);
                const response = await fetch(part.path);
                if (!response.ok) {
                    throw new Error(`Kan bestand niet vinden op pad: ${part.path}`);
                }
                const buffer = await response.arrayBuffer();
                fileArray.push({
                    data: new Uint8Array(buffer),
                    address: part.offset
                });
            }

            log('Bezig met wegschrijven naar flash (settings behouden)...');

            const flashOptions = {
                fileArray: fileArray,
                flashSize: "keep",
                eraseAll: false, // Dit zorgt ervoor dat je settings NIET gewist worden!
                compress: true,
                reportProgress: (fileIndex, written, total) => {
                    const percent = Math.floor((written / total) * 100);
                    log(`Voortgang bestand ${fileIndex + 1}: ${percent}%`);
                }
            };

            await esploader.writeFlash(flashOptions);
            log('\n[SUCCES] Firmware succesvol geflasht zonder data te wissen!');
            
            await esploader.after("hard_reset");
            log('[HERSTART] Apparaat herstart.');

        } catch (e) {
            log(`\n[FOUT] Tijdens flashen: ${e.message}`);
        } finally {
            flashBtn.disabled = false;
        }
    });
</script>

</body>
</html>
