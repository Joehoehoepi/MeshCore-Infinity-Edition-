<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeshCore Infinity Edition - Web Flasher</title>
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
    <style>
        :root {
            --neon-green: #00ff66;
            --neon-glow: rgba(0, 255, 102, 0.3);
            --bg-dark: #050805;
            --card-bg: #0d140e;
            --text-main: #00ff66;
            --text-dim: #00aa44;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .terminal-container {
            background-color: var(--card-bg);
            border: 2px solid var(--neon-green);
            box-shadow: 0 0 25px var(--neon-glow);
            border-radius: 6px;
            width: 100%;
            max-width: 550px;
            padding: 30px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.5rem;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 2px;
            margin-top: 0;
            margin-bottom: 10px;
            text-shadow: 0 0 10px var(--neon-glow);
        }

        .subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select {
            width: 100%;
            background-color: var(--bg-dark);
            color: var(--neon-green);
            border: 2px solid var(--neon-green);
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            box-sizing: border-box;
        }

        select:focus {
            box-shadow: 0 0 10px var(--neon-glow);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-dark);
            border: 1px solid var(--text-dim);
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 25px;
        }

        .checkbox-group input[type="checkbox"] {
            accent-color: var(--neon-green);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            margin-bottom: 0;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-main);
        }

        /* ESP Web Tools Button Customization */
        esp-web-install-button {
            display: block;
            width: 100%;
            margin-top: 15px;
            --esp-tools-button-color: var(--neon-green);
            --esp-tools-button-text-color: var(--bg-dark);
            --esp-tools-button-border-radius: 4px;
        }

        /* Styling inside shadow DOM fallback/variables */
        esp-web-install-button::part(button) {
            background-color: var(--neon-green) !important;
            color: var(--bg-dark) !important;
            font-family: 'Courier New', Courier, monospace !important;
            font-weight: bold !important;
            text-transform: uppercase !important;
            letter-spacing: 1px !important;
            border: 2px solid var(--neon-green) !important;
            box-shadow: 0 0 10px var(--neon-glow) !important;
            width: 100% !important;
            padding: 14px !important;
        }

        esp-web-install-button::part(button):hover {
            background-color: var(--bg-dark) !important;
            color: var(--neon-green) !important;
        }

        .footer-note {
            margin-top: 25px;
            font-size: 0.75rem;
            text-align: center;
            color: var(--text-dim);
            border-top: 1px dashed var(--text-dim);
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="terminal-container">
        <h1>MeshCore Infinity</h1>
        <div class="subtitle">// Flasher v1.17.0</div>

        <div class="form-group">
            <label for="boardSelect">&gt; Selecteer Hardware Model:</label>
            <select id="boardSelect"></select>
        </div>

        <div class="checkbox-group" id="eraseContainer">
            <input type="checkbox" id="eraseCheckbox">
            <label for="eraseCheckbox">Wis geheugen / flash (Erase NVS & Settings bij nieuwe installatie)</label>
        </div>

        <div id="installButtonContainer">
            <esp-web-install-button id="installButton"></esp-web-install-button>
        </div>

        <div class="footer-note">
            [SYSTEM READY] Sluit uw ESP32 via USB aan en selecteer de juiste firmware.
        </div>
    </div>

    <script>
        const firmwareConfigs = [
            {
                name: "MeshCore Infinity Edition - Heltec V2",
                version: "1.17.0",
                builds: [
                    {
                        chipFamily: "ESP32",
                        parts: [
                            { path: "compiled_firmware/Heltec_v2_companion/bootloader.bin", offset: 4096 },
                            { path: "compiled_firmware/Heltec_v2_companion/partitions.bin", offset: 32768 },
                            { path: "compiled_firmware/Heltec_v2_companion/boot_app0.bin", offset: 57344 },
                            { path: "compiled_firmware/Heltec_v2_companion/firmware.bin", offset: 65536 }
                        ]
                    }
                ]
            },
            {
                name: "MeshCore Infinity Edition - Heltec V3",
                version: "1.17.0",
                builds: [
                    {
                        chipFamily: "ESP32-S3",
                        parts: [
                            { path: "compiled_firmware/Heltec_v3_companion/bootloader.bin", offset: 0 },
                            { path: "compiled_firmware/Heltec_v3_companion/partitions.bin", offset: 32768 },
                            { path: "compiled_firmware/Heltec_v3_companion/boot_app0.bin", offset: 57344 },
                            { path: "compiled_firmware/Heltec_v3_companion/firmware.bin", offset: 65536 }
                        ]
                    }
                ]
            },
            {
                name: "MeshCore Infinity Edition - Heltec V4",
                version: "1.17.0",
                builds: [
                    {
                        chipFamily: "ESP32-S3",
                        parts: [
                            { path: "compiled_firmware/Heltec_v4_companion/bootloader.bin", offset: 0 },
                            { path: "compiled_firmware/Heltec_v4_companion/partitions.bin", offset: 32768 },
                            { path: "compiled_firmware/Heltec_v4_companion/boot_app0.bin", offset: 57344 },
                            { path: "compiled_firmware/Heltec_v4_companion/firmware.bin", offset: 65536 }
                        ]
                    }
                ]
            },
            {
                name: "MeshCore Infinity Edition - Heltec V4 TFT",
                version: "1.17.0",
                builds: [
                    {
                        chipFamily: "ESP32-S3",
                        parts: [
                            { path: "compiled_firmware/Heltec_v4_tft_companion_radio/bootloader.bin", offset: 0 },
                            { path: "compiled_firmware/Heltec_v4_tft_companion_radio/partitions.bin", offset: 32768 },
                            { path: "compiled_firmware/Heltec_v4_tft_companion_radio/boot_app0.bin", offset: 57344 },
                            { path: "compiled_firmware/Heltec_v4_tft_companion_radio/firmware.bin", offset: 65536 }
                        ]
                    }
                ]
            },
            {
                name: "MeshCore Infinity Edition - LilyGO T3S3",
                version: "1.17.0",
                builds: [
                    {
                        chipFamily: "ESP32-S3",
                        parts: [
                            { path: "compiled_firmware/LilyGo_T3S3_sx1262_companion/bootloader.bin", offset: 0 },
                            { path: "compiled_firmware/LilyGo_T3S3_sx1262_companion/partitions.bin", offset: 32768 },
                            { path: "compiled_firmware/LilyGo_T3S3_sx1262_companion/boot_app0.bin", offset: 57344 },
                            { path: "compiled_firmware/LilyGo_T3S3_sx1262_companion/firmware.bin", offset: 65536 }
                        ]
                    }
                ]
            },
            {
                name: "MeshCore Infinity Edition - Xiao S3 Wio",
                version: "1.17.0",
                builds: [
                    {
                        chipFamily: "ESP32-S3",
                        parts: [
                            { path: "compiled_firmware/Xiao_S3_WIO_companion/bootloader.bin", offset: 0 },
                            { path: "compiled_firmware/Xiao_S3_WIO_companion/partitions.bin", offset: 32768 },
                            { path: "compiled_firmware/Xiao_S3_WIO_companion/boot_app0.bin", offset: 57344 },
                            { path: "compiled_firmware/Xiao_S3_WIO_companion/firmware.bin", offset: 65536 }
                        ]
                    }
                ]
            }
        ];

        const boardSelect = document.getElementById('boardSelect');
        const eraseCheckbox = document.getElementById('eraseCheckbox');
        const installButton = document.getElementById('installButton');
        let currentBlobUrl = null;

        // Populate dropdown menu
        firmwareConfigs.forEach((config, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = config.name.replace("MeshCore Infinity Edition - ", "");
            boardSelect.appendChild(option);
        });

        function updateManifest() {
            const selectedIndex = boardSelect.value;
            const selectedConfig = firmwareConfigs[selectedIndex];

            const manifest = {
                name: selectedConfig.name,
                version: selectedConfig.version,
                new_install_prompt_erase: eraseCheckbox.checked,
                builds: selectedConfig.builds
            };

            // Ruim vorige blob op om geheugenlekkage te voorkomen
            if (currentBlobUrl) {
                URL.revokeObjectURL(currentBlobUrl);
            }

            // Maak een virtuele URL van de JSON-data
            const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            currentBlobUrl = URL.createObjectURL(blob);

            // Wijs de Blob-URL toe aan de installatieknop
            installButton.setAttribute('manifest', currentBlobUrl);
        }

        boardSelect.addEventListener('change', updateManifest);
        eraseCheckbox.addEventListener('change', updateManifest);

        // Initial load
        updateManifest();
    </script>
</body>
</html>
